<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Elementos que no se tocan -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!--
            Editables según el proyecto
    -->
    <title>Texto pestaña navegador</title>
    <!-- imagen que aparece en la pestaña del navegador -->
    <link rel="shortcut icon" href="assets/img/banner.jpg" type="image/x-icon">
    <!-- Descripción del sitio (la que aparece en google) -->
    <meta name="description" content="Soy un texto editable que se ve en los buscadores (el que aparece abajo de los link)">
    <!-- Palabras claves para que encuentren nuestra página -->
    <meta name="keywords" content="palabras, claves, para, los, buscadores">
    <!-- Editables no obligatorios -->
    <!-- Lo que aparece al compartir por whatsapp -->
    <meta property="og:title" content="Title" />
    <meta property="og:description" content="Descripción" />
    <meta property="og:image" content="Imagen" />


    <!-- links de google Fonts (3) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
    <!-- Link de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Link de Bootstrap Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Link de nuestro CSS -->
    <link rel="stylesheet" href="assets/css/estilos.css">
</head>

    <!-- JS de Bootstrap se necesita para su funcionamiento -->

        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
