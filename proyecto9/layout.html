<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout responsivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="container-fluid bg-light">Barra de navegación</header>
    <main>
        <section class="container-fluid bg-dark text-light">
            HERO SECTION
        </section>
        <section class="container-fluid">
            <div class="row">
                <div class="col-12 px-4">
                    <img src="assets/img/banner.jpg" alt="" class="img-fluid">
                </div>
            </div>
        </section>

        <section class="container bg-danger">
            <div class="row">
                <div class="col-4 bg-warning">TESTIMONIO A</div>
                <div class="col-4 bg-info">TESTIMONIO B</div>
                <div class="col-4 bg-warning">TESTIMONIO C</div>
            </div>
        </section>

        <section class="container">
            <div class="row">
                <div class="col-3 bg-success">EQUIPO A</div>
                <div class="col-3 bg-danger">EQUIPO B</div>
                <div class="col-3 bg-success">EQUIPO C</div>
                <div class="col-3 bg-danger">EQUIPO D</div>
            </div>
        </section>

        <section class="container">
            <div class="row">
                <div class="col-12 bg-primary">NOTICIA 1</div>
                <div class="col-12 bg-danger">NOTICIA 2</div>
            </div>
        </section>
    </main>
    <footer class="container-fluid bg-dark">
        <div class="row">
            <div class="col-3 bg-success">COLUMNA 1</div>
            <div class="col-3 bg-secondary">COLUMNA 2</div>
            <div class="col-3 bg-success">COLUMNA 3</div>
            <div class="col-3 bg-secondary">COLUMNA 4</div>
        </div>
    </footer>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
