<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout responsivos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header class="container-fluid bg-light">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">LOGO</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <form class="d-flex mx-auto" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                    </form>
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <button type="button" class="btn btn-dark">Dark</button>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="container-fluid bg-danger text-light px-0 mb-5">
            <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="assets/img/carrousel1.webp" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/carrousel2.webp" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/carrousel3.webp" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="assets/img/carrousel4.webp" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <section class="container-fluid">
            <div class="row">
                <div class="col-12 px-4">
                    <img src="assets/img/banner.jpg" alt="" class="img-fluid">
                </div>
            </div>
        </section>

        <section class="container mt-5">
            <div class="row">
                <div class="col-10 mx-auto col-md-4">
                    <div class="card border-0">
                        <div class="card-body">
                            <div class="d-flex flex-row">
                                <img src="assets/img/opinion1.jpg" alt="">
                                <h5 class="card-title">Card title</h5>
                            </div>
                            <p class="card-text">Some quick example text to build on the card title and make up the bulk
                                of the card’s content.</p>
                        </div>
                    </div>
                </div>
                <div class="col-10 mx-auto col-md-4 bg-info">TESTIMONIO B</div>
                <div class="col-10 mx-auto col-md-4 bg-warning">TESTIMONIO C</div>
            </div>
        </section>

        <section class="container my-5">
            <div class="row">
                <div class="col-10 mx-auto col-sm-6 col-md-3 bg-success">EQUIPO A</div>
                <div class="col-10 mx-auto col-sm-6 col-md-3 bg-danger">EQUIPO B</div>
                <div class="col-10 mx-auto col-sm-6 col-md-3 bg-success">EQUIPO C</div>
                <div class="col-10 mx-auto col-sm-6 col-md-3 bg-danger">EQUIPO D</div>
            </div>
        </section>

        <section class="container">
            <div class="row">
                <div class="col-12 bg-primary">NOTICIA 1</div>
                <div class="col-12 bg-danger">NOTICIA 2</div>
            </div>
        </section>
    </main>
    <footer class="container-fluid bg-dark">
        <div class="row">
            <div class="col-3 bg-success">COLUMNA 1</div>
            <div class="col-3 bg-secondary">COLUMNA 2</div>
            <div class="col-3 bg-success">COLUMNA 3</div>
            <div class="col-3 bg-secondary">COLUMNA 4</div>
        </div>
    </footer>







    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
